<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/images/logo12.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEW ADARSH MANPOWER CONSULTANT PRIVATE LIMITED - Approved by MEA, Govt of India</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gold: {
                500: '#e11d48',
                600: '#be123c',
              },
              brandBlue: '#0047ba',
              brandRed: '#e11d48',
              brandGreen: '#4ba010',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              heading: ['Outfit', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <script type="module" crossorigin src="/assets/index-JIFOHFoG.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Fxh5ePHN.css">
  </head>
  <body>
    <div id="root"></div>

<!-- Employer Enquiry Section -->
<section class="max-w-4xl mx-auto p-6 bg-white rounded shadow-md my-8">
  <h2 class="text-2xl font-bold mb-4">Employer Enquiry</h2>
  <form class="grid grid-cols-1 gap-4">
    <div>
      <label class="block mb-1 font-medium">Company Name</label>
      <input type="text" name="company_name" class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block mb-1 font-medium">Contact Person</label>
      <input type="text" name="contact_person" class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block mb-1 font-medium">Email</label>
      <input type="email" name="employer_email" class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block mb-1 font-medium">Phone</label>
      <input type="tel" name="employer_phone" class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block mb-1 font-medium">Country</label>
      <input type="text" name="employer_country" class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block mb-1 font-medium">Industry</label>
      <input type="text" name="industry" class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block mb-1 font-medium">Manpower Requirements</label>
      <textarea name="requirements" class="w-full border rounded px-3 py-2"></textarea>
    </div>
    <div>
      <label class="block mb-1 font-medium">Number of Employees Required</label>
      <input type="number" name="num_employees" class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block mb-1 font-medium">Additional Message</label>
      <textarea name="additional_message" class="w-full border rounded px-3 py-2"></textarea>
    </div>
    <div class="flex justify-end">
      <button type="submit" class="px-6 py-2 bg-brandBlue text-white rounded hover:bg-brandBlue-600">Apply Now</button>
    </div>
  </form>
</section>

<!-- Candidate Registration Section -->
<section class="max-w-4xl mx-auto p-6 bg-white rounded shadow-md my-8">
  <h2 class="text-2xl font-bold mb-4">Candidate Registration</h2>
  <form class="grid grid-cols-1 gap-4" enctype="multipart/form-data">
    <div>
      <label class="block mb-1 font-medium">Full Name</label>
      <input type="text" name="candidate_name" class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block mb-1 font-medium">Mobile Number</label>
      <input type="tel" name="candidate_mobile" class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block mb-1 font-medium">Email</label>
      <input type="email" name="candidate_email" class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block mb-1 font-medium">Qualification</label>
      <input type="text" name="qualification" class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block mb-1 font-medium">Experience (years)</label>
      <input type="number" name="experience" class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block mb-1 font-medium">Preferred Country</label>
      <input type="text" name="preferred_country" class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block mb-1 font-medium">Preferred Job Category</label>
      <input type="text" name="job_category" class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block mb-1 font-medium">Upload CV (PDF/DOC/DOCX)</label>
      <input type="file" name="cv" accept=".pdf,.doc,.docx" class="w-full" />
    </div>
    <div class="flex justify-end">
      <button type="submit" class="px-6 py-2 bg-brandGreen text-white rounded hover:bg-brandGreen-600">Submit Application</button>
    </div>
  </form>
</section>
  </body>
</html>
